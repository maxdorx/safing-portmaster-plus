name: Go

on:
  push:
    paths:
      - '.github/workflows/go.yml'
      - '.golangci.yml'
      - 'go.mod'
      - 'go.sum'
      - 'Earthfile'
      - '**.go'
      - 'cmds/**'
      - 'runtime/**'
      - 'service/**'
      - 'spn/**'
    branches:
      - main
      - development
      - v1-legacy
      - v1-legacy-develop

  pull_request:
    paths:
      - '.github/workflows/go.yml'
      - '.golangci.yml'
      - 'go.mod'
      - 'go.sum'
      - 'Earthfile'
      - '**.go'
      - 'cmds/**'
      - 'runtime/**'
      - 'service/**'
      - 'spn/**'
    branches:
      - main
      - development
      - v1-legacy
      - v1-legacy-develop

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.26.x'
        cache: false

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.12.2
        install-mode: goinstall
        only-new-issues: true
        # The action applies only-new-issues automatically to PRs, not pushes.
        # Check all fork changes against the upstream 2.2.8 source on both.
        args: -c ./.golangci.yml --timeout 15m --new-from-rev=5c82035444a6a383b8b7011ff6834a52f2d238a4

    - name: Run go vet
      run: go vet ./...

  test:
    name: Test & Build
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.26.x'

    - name: Test all Go packages
      run: go test -p 1 -cover -short ./...

    - name: Build supported core targets
      shell: bash
      run: |
        for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
          target_os="${target%/*}"
          target_arch="${target#*/}"
          GOOS="$target_os" GOARCH="$target_arch" go build -trimpath \
            -o "$RUNNER_TEMP/portmaster-core-$target_os-$target_arch" ./cmds/portmaster-core
        done
